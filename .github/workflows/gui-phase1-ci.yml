name: gui-phase1-ci

on:
  pull_request:
    paths:
      - 'gui/**'
      - 'tests/gui/**'
      - '.github/workflows/gui-phase1-ci.yml'
  workflow_dispatch:

jobs:
  wpf-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile WPF shell
        shell: pwsh
        run: dotnet build gui/ScreenConnectCleanup.Gui.csproj -c Release
      - name: Static navigation and command tests
        shell: pwsh
        run: dotnet test tests/gui/phase1/ScreenConnectCleanup.Gui.Phase1.Tests.csproj -c Release --logger 'console;verbosity=normal'
      - name: Bounded WPF startup smoke (not visible UI validation)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'gui/bin/Release/net10.0-windows10.0.17763.0/ScreenConnectCleanup.Gui.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing GUI executable: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "WPF startup exited early: $($process.ExitCode)" }
            Write-Host 'WPF process remained alive after startup; visual and UAC validation remain owner-gated.'
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
