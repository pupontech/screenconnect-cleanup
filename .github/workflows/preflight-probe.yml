name: preflight-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dump preflight low-space capture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $repoRoot = $PWD.Path
          $preflightPath = Join-Path $repoRoot 'preflight.ps1'
          $probeRoot = Join-Path $env:TEMP ('scc-preflight-probe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $toolStub = Join-Path $probeRoot 'toolpack-stub.ps1'
          Set-Content -LiteralPath $toolStub -Value "param([switch]`$Verify, [switch]`$Quiet)`nexit 0" -Encoding ASCII
          $runRoot = Join-Path $probeRoot 'run'
          $arguments = @('-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',$preflightPath,'-np','-Force','-MinFreeGB','2147483647','-WorkingRoot',$runRoot,'-ToolPackPath',$toolStub)
          $output = 'Y' | & powershell.exe @arguments 2>&1
          $rc = $LASTEXITCODE
          $text = ($output -join "`n")
          Write-Host "RC=$rc"
          Write-Host "TEXTLEN=$($text.Length)"
          Write-Host ('MATCH_FREE=' + [bool]($text -match 'Only [0-9]+([.,][0-9]+)? GB free on'))
          Write-Host ('MATCH_CONTINUE=' + [bool]($text -match '(?i)Continue anyway\? \[y/N\]'))
          Write-Host '=== RAW CAPTURED TEXT (escaped) ==='
          $esc = $text -replace "`r",'\r' -replace "`n",'\n'
          Write-Host $esc
