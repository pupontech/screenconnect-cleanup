name: windows-ci

# Real-Windows CI on GitHub-hosted Windows VMs.
# Exercises the tool's house rules AND safe (non-destructive) integration paths
# under BOTH PowerShell editions:
#   - Windows PowerShell 5.1 (the technician target runtime)
#   - PowerShell 7+ (pwsh, used for local dev checks)
# No ScreenConnect install or destructive removal happens here - live testing
# stays manual and destructive removal stays on a disposable dedicated lab VM.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: House rules - pure ASCII, no BOM, valid JSON
        shell: pwsh
        run: ./tests/ci/Test-HouseRules.ps1

      - name: Parse all scripts - Windows PowerShell 5.1
        shell: powershell
        run: ./tests/ci/Test-Parse.ps1

      - name: Parse all scripts - PowerShell 7 (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-Parse.ps1

      - name: Smoke - detect-remote-access target list loads (5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./detect-remote-access.ps1 -ListTargets

      - name: Smoke - detect-remote-access target list loads (pwsh)
        shell: pwsh
        run: ./detect-remote-access.ps1 -ListTargets

      - name: SelfTest - detect-remote-access parser self-test (5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./detect-remote-access.ps1 -SelfTest -NoPause

      - name: SelfTest - preflight self-test (pwsh)
        shell: pwsh
        run: ./preflight.ps1 -SelfTest

      - name: Regression - low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_preflight_low_space_prompt.ps1

      - name: Regression - low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_preflight_low_space_prompt.ps1

      - name: Regression - direct runner low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_direct_runner_low_space_prompt.ps1

      - name: Regression - direct runner low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_direct_runner_low_space_prompt.ps1

      - name: Regression - review wrapper low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_review_wrapper_low_space_prompt.ps1

      - name: Regression - review wrapper low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_review_wrapper_low_space_prompt.ps1

      - name: Safe Windows integration (removal dry-run + XSS + WhatIf) - 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-WindowsIntegration.ps1

      - name: Safe Windows integration (removal dry-run + XSS + WhatIf) - pwsh
        shell: pwsh
        run: ./tests/ci/Test-WindowsIntegration.ps1

      - name: Stage 4 removal runtime contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-RemovalRuntimeContracts.ps1

      - name: Stage 4 removal runtime contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-RemovalRuntimeContracts.ps1

      - name: Pipeline + launcher contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-PipelineLauncherContracts.ps1

      - name: Pipeline + launcher contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-PipelineLauncherContracts.ps1

      - name: Scanner process contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-ScannerProcessContracts.ps1

      - name: Scanner process contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-ScannerProcessContracts.ps1

      - name: CLI output contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-CLIOutputContracts.ps1

      - name: CLI output contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-CLIOutputContracts.ps1

      - name: Safety regression contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-SafetyRegressionContracts.ps1

      - name: Safety regression contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-SafetyRegressionContracts.ps1

      - name: Report rendering regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_report_scanner_section.ps1

      - name: Report rendering regression (pwsh)
        shell: pwsh
        run: ./tests/test_report_scanner_section.ps1

      - name: ConnectWise report package/upload regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_connectwise_report_upload.ps1

      - name: ConnectWise report package/upload regression (pwsh)
        shell: pwsh
        run: ./tests/test_connectwise_report_upload.ps1

      - name: Relay and bulk-export unit tests
        shell: pwsh
        run: python -m unittest relay.test_report_relay relay.test_export_iocs -v

      - name: Synthetic Stage 7 diff test (end-to-end via pwsh)
        shell: pwsh
        env:
          SCC_TEST_TMP: ${{ runner.temp }}
        run: python ./tests/test_diff_synthetic.py

      - name: Upload diff output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-diff-debug-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/synth-before.json
            ${{ runner.temp }}/synth-after.json
            ${{ runner.temp }}/synth-diff.json
          if-no-files-found: ignore
