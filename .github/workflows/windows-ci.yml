name: windows-ci

# Real-Windows CI on GitHub-hosted Windows VMs.
# Exercises the tool's house rules AND safe (non-destructive) integration paths
# under BOTH PowerShell editions:
#   - Windows PowerShell 5.1 (the technician target runtime)
#   - PowerShell 7+ (pwsh, used for local dev checks)
# No ScreenConnect install or destructive removal happens here - live testing
# stays manual and destructive removal stays on a disposable dedicated lab VM.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: House rules - pure ASCII, no BOM, valid JSON
        shell: pwsh
        run: ./tests/ci/Test-HouseRules.ps1

      - name: Parse all scripts - Windows PowerShell 5.1
        shell: powershell
        run: ./tests/ci/Test-Parse.ps1

      - name: Parse all scripts - PowerShell 7 (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-Parse.ps1

      - name: Smoke - detect-remote-access target list loads (5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./detect-remote-access.ps1 -ListTargets

      - name: Smoke - detect-remote-access target list loads (pwsh)
        shell: pwsh
        run: ./detect-remote-access.ps1 -ListTargets

      - name: SelfTest - detect-remote-access parser self-test (5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./detect-remote-access.ps1 -SelfTest -NoPause

      - name: SelfTest - preflight self-test (pwsh)
        shell: pwsh
        run: ./preflight.ps1 -SelfTest

      - name: Regression - low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_preflight_low_space_prompt.ps1

      - name: Regression - low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_preflight_low_space_prompt.ps1

      - name: Regression - direct runner low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_direct_runner_low_space_prompt.ps1

      - name: Regression - direct runner low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_direct_runner_low_space_prompt.ps1

      - name: Regression - review wrapper low-space confirmation (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_review_wrapper_low_space_prompt.ps1

      - name: Regression - review wrapper low-space confirmation (pwsh)
        shell: pwsh
        run: ./tests/test_review_wrapper_low_space_prompt.ps1

      - name: Safe Windows integration (removal dry-run + XSS + WhatIf) - 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-WindowsIntegration.ps1

      - name: Safe Windows integration (removal dry-run + XSS + WhatIf) - pwsh
        shell: pwsh
        run: ./tests/ci/Test-WindowsIntegration.ps1

      - name: Stage 4 removal runtime contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-RemovalRuntimeContracts.ps1

      - name: Stage 4 removal runtime contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-RemovalRuntimeContracts.ps1

      - name: Pipeline + launcher contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-PipelineLauncherContracts.ps1

      - name: Pipeline + launcher contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-PipelineLauncherContracts.ps1

      - name: Keep-awake helper runtime (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-KeepAwakeRuntime.ps1

      - name: Keep-awake helper runtime (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-KeepAwakeRuntime.ps1

      - name: Battery warning classifier runtime (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-BatteryConfirmRuntime.ps1

      - name: Battery warning classifier runtime (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-BatteryConfirmRuntime.ps1

      - name: Battery foreground console visibility (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-BatteryConsoleVisibility.ps1

      - name: Battery foreground console visibility (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-BatteryConsoleVisibility.ps1

      - name: Launcher elevation bound (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-LauncherElevationBound.ps1

      - name: Launcher elevation bound (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-LauncherElevationBound.ps1

      - name: Scanner process contracts (powershell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-ScannerProcessContracts.ps1

      - name: Scanner process contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-ScannerProcessContracts.ps1

      - name: CLI output contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-CLIOutputContracts.ps1

      - name: CLI output contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-CLIOutputContracts.ps1

      - name: Safety regression contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/ci/Test-SafetyRegressionContracts.ps1

      - name: Safety regression contracts (pwsh)
        shell: pwsh
        run: ./tests/ci/Test-SafetyRegressionContracts.ps1

      - name: Report rendering regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_report_scanner_section.ps1

      - name: Report rendering regression (pwsh)
        shell: pwsh
        run: ./tests/test_report_scanner_section.ps1

      - name: Scanner findings parser regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_scanner_findings_parser.ps1

      - name: Scanner findings parser regression (pwsh)
        shell: pwsh
        run: ./tests/test_scanner_findings_parser.ps1

      - name: ConnectWise report package/upload regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_connectwise_report_upload.ps1

      - name: ConnectWise report package/upload regression (pwsh)
        shell: pwsh
        run: ./tests/test_connectwise_report_upload.ps1

      - name: MicroBin paste URL in HTML report regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_microbin_report_html_link.ps1

      - name: MicroBin paste URL in HTML report regression (pwsh)
        shell: pwsh
        run: ./tests/test_microbin_report_html_link.ps1

      - name: Run-folder transcript copy regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_run_artifact_copies.ps1

      - name: Run-folder transcript copy regression (pwsh)
        shell: pwsh
        run: ./tests/test_run_artifact_copies.ps1

      - name: Review regressions - staging, evidence, TCP inventory (5.1)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_av_staging_validation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_diff_evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_detector_connections.ps1
          exit $LASTEXITCODE

      - name: Review regressions - staging, evidence, TCP inventory (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/test_av_staging_validation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tests/test_diff_evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tests/test_detector_connections.ps1
          exit $LASTEXITCODE

      - name: MicroBin loopback upload regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_microbin_report_upload.ps1

      - name: MicroBin loopback upload regression (pwsh)
        shell: pwsh
        run: ./tests/test_microbin_report_upload.ps1

      - name: Incident context and dates regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_incident_context_and_dates.ps1

      - name: Incident context and dates regression (pwsh)
        shell: pwsh
        run: ./tests/test_incident_context_and_dates.ps1

      - name: Download diagnostics classifier fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_malwarebytes_download_diagnostics.ps1

      - name: Download diagnostics classifier fixtures (pwsh)
        shell: pwsh
        run: ./tests/test_malwarebytes_download_diagnostics.ps1

      - name: Malwarebytes offline fallback regression (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_malwarebytes_fallback.ps1

      - name: Malwarebytes offline fallback regression (pwsh)
        shell: pwsh
        run: ./tests/test_malwarebytes_fallback.ps1

      - name: Post-AV persistence fixture and refusal tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($test in @('tests/test_persistence_inventory.ps1', 'tests/test_persistence_removal.ps1', 'tests/test_persistence_workflow.ps1', 'tests/test_persistence_report.ps1', 'tests/test_persistence_output_safety.ps1', 'tests/test_persistence_native_fileinfo.ps1', 'tests/test_persistence_watchdog.ps1', 'tests/ci/Test-PersistenceContracts.ps1')) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Post-AV persistence fixture and refusal tests (pwsh)
        shell: pwsh
        run: |
          foreach ($test in @('tests/test_persistence_inventory.ps1', 'tests/test_persistence_removal.ps1', 'tests/test_persistence_workflow.ps1', 'tests/test_persistence_report.ps1', 'tests/test_persistence_output_safety.ps1', 'tests/test_persistence_native_fileinfo.ps1', 'tests/test_persistence_watchdog.ps1', 'tests/ci/Test-PersistenceContracts.ps1')) {
            pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build allowlisted testing ZIP from the tested checkout
        shell: bash
        env:
          PYTHON: python
        run: bash ./make-deploy-bundle.sh

      - name: Verify ZIP and execute packaged persistence fixture tests (5.1 and pwsh)
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $zip = Join-Path (Split-Path -Parent $PWD.Path) "screenconnect-cleanup-v$version.zip"
          $sha = (git rev-parse HEAD).Trim()
          python ./tests/verify_deploy_zip.py $zip --version $version --commit $sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extract = Join-Path $env:RUNNER_TEMP ('scc-package-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $package = Join-Path $extract 'screenconnect-cleanup'
          New-Item -ItemType Directory -Path (Join-Path $package 'tests') | Out-Null
          foreach ($test in @('test_persistence_inventory.ps1', 'test_persistence_removal.ps1', 'test_persistence_report.ps1', 'test_persistence_workflow.ps1', 'test_persistence_output_safety.ps1', 'test_persistence_native_fileinfo.ps1', 'test_persistence_watchdog.ps1')) {
            $copied = Join-Path (Join-Path $package 'tests') $test
            Copy-Item -LiteralPath (Join-Path 'tests' $test) -Destination $copied
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $copied
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File $copied
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $visibilityTest = Join-Path $env:RUNNER_TEMP 'Test-BatteryConsoleVisibility.ps1'
          Copy-Item -LiteralPath 'tests/ci/Test-BatteryConsoleVisibility.ps1' -Destination $visibilityTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $visibilityTest -RepositoryRoot $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $visibilityTest -RepositoryRoot $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elevationTest = Join-Path $env:RUNNER_TEMP 'Test-LauncherElevationBound.ps1'
          Copy-Item -LiteralPath 'tests/ci/Test-LauncherElevationBound.ps1' -Destination $elevationTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $elevationTest -RepositoryRoot $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $elevationTest -RepositoryRoot $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($zip + '.sha256'), ($digest + '  ' + [IO.Path]::GetFileName($zip) + "`n"), [Text.Encoding]::ASCII)
          $uploadDirectory = Join-Path $env:RUNNER_TEMP 'scc-verified-package'
          New-Item -ItemType Directory -Path $uploadDirectory -Force | Out-Null
          Copy-Item -LiteralPath $zip -Destination $uploadDirectory
          Copy-Item -LiteralPath ($zip + '.sha256') -Destination $uploadDirectory

      - name: Upload verified testing bundle
        uses: actions/upload-artifact@v4
        with:
          name: persistence-testing-bundle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/scc-verified-package/screenconnect-cleanup-v*.zip
            ${{ runner.temp }}/scc-verified-package/screenconnect-cleanup-v*.zip.sha256
          if-no-files-found: error

      - name: Relay and bulk-export unit tests
        shell: pwsh
        run: python -m unittest relay.test_report_relay relay.test_export_iocs -v

      - name: Synthetic Stage 7 diff test (end-to-end via pwsh)
        shell: pwsh
        env:
          SCC_TEST_TMP: ${{ runner.temp }}
        run: python ./tests/test_diff_synthetic.py

      - name: Upload diff output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-diff-debug-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/synth-before.json
            ${{ runner.temp }}/synth-after.json
            ${{ runner.temp }}/synth-diff.json
          if-no-files-found: ignore
